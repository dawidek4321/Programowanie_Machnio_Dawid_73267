<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kwiaciarnia - Zamówienie</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Zamówienie Aranżacji Kwiatowych</h1>
        </header>

        <section class="card cart-controls">
            <h2>1. Skomponuj zamówienie</h2>
            <div class="form-group">
                <label for="bukietTyp">Rodzaj bukietu:</label>
                <select id="bukietTyp">
                    <option value="rozany">Różowy Różany (50 zł)</option>
                    <option value="lilak">Biały Lilak (40 zł)</option>
                    <option value="chryzantemy">Bordowe Chryzantemy (45 zł)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="bukietIlosc">Ilość:</label>
                <input type="number" id="bukietIlosc" value="1" min="1">
            </div>
            <button type="button" id="btnDodajDoKoszyka" class="btn-secondary">Dodaj do koszyka</button>
            <span class="error" id="koszykError"></span>
            
            <div id="koszykLista" class="cart-list">
                <p class="empty-cart-msg">Twój koszyk jest pusty.</p>
            </div>
        </section>

        <form id="orderForm" novalidate>
            
            <section class="card">
                <h2>2. Usługi dodatkowe</h2>
                <div class="checkbox-group">
                    <input type="checkbox" id="uslugaBilecik" value="5">
                    <label for="uslugaBilecik">Karteczka z życzeniami (+5 zł)</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="uslugaDekoracja" value="15">
                    <label for="uslugaDekoracja">Dodatkowa dekoracja premium (+15 zł)</label>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="uslugaDostawa" value="20">
                    <label for="uslugaDostawa">Dostawa na wskazany adres (+20 zł)</label>
                </div>
            </section>

            <section class="card hidden" id="sekcjaDostawy">
                <h2>Dane do dostawy</h2>
                <div class="form-group">
                    <label for="adresDostawy">Adres odbiorcy (ulica, miasto, kod pocztowy):</label>
                    <input type="text" id="adresDostawy">
                    <span class="error"></span>
                </div>
            </section>

            <section class="card">
                <h2>3. Twoje dane kontaktowe</h2>
                <div class="form-group">
                    <label for="imie">Imię:</label>
                    <input type="text" id="imie" required>
                    <span class="error"></span>
                </div>
                <div class="form-group">
                    <label for="nazwisko">Nazwisko:</label>
                    <input type="text" id="nazwisko" required>
                    <span class="error"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                    <span class="error"></span>
                </div>
                <div class="form-group">
                    <label for="telefon">Telefon:</label>
                    <input type="text" id="telefon" required>
                    <span class="error"></span>
                </div>
            </section>

            <div class="summary-section">
                <h3>Całkowita kwota do zapłaty: <span id="sumaCalkowita">0</span> zł</h3>
                <button type="submit" id="btnWyslij" class="btn-primary">Złóż Zamówienie</button>
            </div>
        </form>

        <div id="sukcesModal" class="modal hidden">
            <div class="modal-content">
                <h2>Zamówienie przyjęte!</h2>
                <p>Dziękujemy. Twoje kwiaty wkrótce będą gotowe.</p>
                <button onclick="location.reload()" class="btn-secondary">Zamknij</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
